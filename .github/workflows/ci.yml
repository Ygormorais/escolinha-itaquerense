name: CI

on:
  push:
    branches: [develop, master]
  pull_request:
    branches: [develop, master]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npx prisma generate
        env:
          PRISMA_CONFIG_PATH: prisma.config.ts

      # vitest pendura no teardown (handle nativo do better-sqlite3 + workers em
      # fork): os testes terminam e o relatorio e escrito, mas o processo nao sai.
      # Rodamos com timeout e checamos o relatorio JSON como gate real de pass/fail.
      - name: Test (watchdog)
        run: |
          rm -f vitest-report.json
          timeout 200 npx vitest run --reporter=dot --reporter=json --outputFile=vitest-report.json || true
          test -f vitest-report.json || { echo "::error::vitest nao gerou o relatorio (travou antes de reportar)"; exit 1; }
          node -e "const r=require('./vitest-report.json'); if(!r.success||r.numFailedTests>0||r.numFailedTestSuites>0){console.error('Testes falharam: '+r.numFailedTests+' testes / '+r.numFailedTestSuites+' suites'); process.exit(1)} console.log('Testes OK: '+r.numPassedTests+' passaram')"

      - run: npm run lint || echo "Lint warnings (non-blocking)"

      - run: npm run build
        env:
          PRISMA_CONFIG_PATH: prisma.config.ts
          NEXT_PUBLIC_APP_URL: http://localhost:3000
          SESSION_SECRET: ci-secret
          ADMIN_USERNAME: admin
          ADMIN_PASSWORD: ci-password
