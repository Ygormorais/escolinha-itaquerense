name: CI

on:
  push:
    branches: [develop, master]
  pull_request:
    branches: [develop, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npx prisma generate
        env:
          PRISMA_CONFIG_PATH: prisma.config.ts

      - name: Migration drift check
        run: npx prisma migrate diff --exit-code --from-migrations prisma/migrations --to-schema prisma/schema.prisma
        env:
          PRISMA_CONFIG_PATH: prisma.config.ts

      - name: Deploy scripts check
        run: |
          for script in deploy/*.sh; do bash -n "$script"; done
          node -e "const { apps } = require('./deploy/ecosystem.config.cjs'); if (apps.length !== 1 || apps[0].name !== 'escolinha') process.exit(1)"

      - run: npx tsc --noEmit
        name: TypeScript check

      - name: Testes e cobertura mínima
        run: npm run test:coverage
        timeout-minutes: 5

      - name: ESLint
        run: npm run lint

      - run: npm run build
        env:
          PRISMA_CONFIG_PATH: prisma.config.ts
          NEXT_PUBLIC_APP_URL: http://localhost:3000
          SESSION_SECRET: ci-secret
          ADMIN_USERNAME: admin
          ADMIN_PASSWORD: ci-password

  e2e:
    # Fixo: ubuntu-latest virou 26.04 e o Playwright 1.60 não instala o Chromium nele.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      DATABASE_URL: file:./prisma/dev.db
      PRISMA_CONFIG_PATH: prisma.config.ts
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      SESSION_SECRET: ci-e2e-secret-with-at-least-32-characters
      ADMIN_USERNAME: admin_e2e_env
      ADMIN_PASSWORD: ci-e2e-password

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Versão do Playwright
        id: pw
        run: echo "version=$(npx playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      # O navegador vem do cache; só baixa quando a versão do Playwright muda.
      - uses: actions/cache@v4
        id: pw-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ steps.pw.outputs.version }}

      - name: Navegador do Playwright
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium

      # Pacotes do sistema via apt: o espelho do runner falha de vez em quando
      # ("Installation process exited with code: 100"), então tenta de novo antes de desistir.
      - name: Dependências do sistema para o Chromium
        run: |
          for tentativa in 1 2 3; do
            if npx playwright install-deps chromium; then exit 0; fi
            echo "Tentativa $tentativa falhou; nova tentativa em 20s"
            sleep 20
            sudo apt-get update -o Acquire::Retries=3 || true
          done
          exit 1

      - name: Migrate e seed
        run: |
          npm run db:migrate
          npm run db:seed

      - name: Build da aplicação para E2E
        run: npm run build

      - name: E2E
        run: npm run test:e2e
        timeout-minutes: 20

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
