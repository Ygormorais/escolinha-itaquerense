name: CI

on:
  push:
    branches: [develop, master]
  pull_request:
    branches: [develop, master]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npx prisma generate
        env:
          PRISMA_CONFIG_PATH: prisma.config.ts

      - run: npx tsc --noEmit
        name: TypeScript check

      - run: npm test
        timeout-minutes: 5

      - run: npm run lint || echo "Lint warnings (non-blocking)"

      - run: npm run build
        env:
          PRISMA_CONFIG_PATH: prisma.config.ts
          NEXT_PUBLIC_APP_URL: http://localhost:3000
          SESSION_SECRET: ci-secret
          ADMIN_USERNAME: admin
          ADMIN_PASSWORD: ci-password

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      - name: Migrate e seed
        run: |
          npm run db:migrate
          npm run db:seed
        env:
          DATABASE_URL: file:./prisma/dev.db
          PRISMA_CONFIG_PATH: prisma.config.ts

      - name: E2E
        run: npm run test:e2e
        env:
          DATABASE_URL: file:./prisma/dev.db
          PRISMA_CONFIG_PATH: prisma.config.ts
          NEXT_PUBLIC_APP_URL: http://localhost:3000
          SESSION_SECRET: ci-e2e-secret
          ADMIN_USERNAME: admin_e2e_env
          ADMIN_PASSWORD: ci-e2e-password
          NODE_ENV: test

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
