name: Backup Diário do Banco

# Faz download do banco SQLite da VPS (Node/PM2) via SSH e salva na branch backups.
# Pré-requisitos (configurar em Settings > Secrets and variables > Actions):
#   SSH_HOST     — IP ou hostname do servidor
#   SSH_USER     — usuário SSH (root no Hetzner/DigitalOcean)
#   SSH_KEY      — chave SSH privada (conteúdo do ~/.ssh/id_rsa)

on:
  schedule:
    - cron: "0 3 * * *"   # 03h UTC = 00h Brasília

  workflow_dispatch:       # Permite disparo manual

permissions:
  contents: write

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: backups

      - name: Configurar SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Baixar banco da VPS de produção
        run: |
          TIMESTAMP=$(date -u +%Y-%m-%d-%H%M%S)
          mkdir -p backups

          # Backup consistente via sqlite3 .backup (não pega estado parcial de escrita), depois baixa por stdout
          ssh "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
            "sqlite3 ~/escolinha-itaquerense/prisma/prod.db \".backup '/tmp/prod-backup.db'\" && cat /tmp/prod-backup.db && rm -f /tmp/prod-backup.db" \
            > "backups/prod-${TIMESTAMP}.db"

          echo "Backup criado: prod-${TIMESTAMP}.db ($(du -sh backups/prod-${TIMESTAMP}.db | cut -f1))"

      - name: Rotacionar backups (manter últimos 30)
        run: |
          cd backups
          ls -1t prod-*.db 2>/dev/null | tail -n +31 | xargs -r rm -f
          echo "Backups mantidos: $(ls -1 prod-*.db 2>/dev/null | wc -l)"

      - name: Commit e push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add backups/
          TIMESTAMP=$(date -u +%Y-%m-%d)
          git diff --staged --quiet || git commit -m "backup: ${TIMESTAMP}"
          git push
