name: Backup Diário do Banco

# Faz download do banco SQLite do container de produção via SSH e salva na branch backups.
# Pré-requisitos (configurar em Settings > Secrets and variables > Actions):
#   SSH_HOST     — IP ou hostname do servidor
#   SSH_USER     — usuário SSH (ex: ubuntu)
#   SSH_KEY      — chave SSH privada (conteúdo do ~/.ssh/id_rsa)
#   CONTAINER_NAME — nome do container Docker (padrão: escolinha)

on:
  schedule:
    - cron: "0 3 * * *"   # 03h UTC = 00h Brasília

  workflow_dispatch:       # Permite disparo manual

permissions:
  contents: write

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: backups

      - name: Configurar SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Baixar banco do container de produção
        run: |
          TIMESTAMP=$(date -u +%Y-%m-%d-%H%M%S)
          mkdir -p backups

          # Copia o banco de dentro do container para o servidor, depois baixa via scp
          ssh "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
            "docker exec ${{ secrets.CONTAINER_NAME || 'escolinha' }} cat /app/prisma/dev.db" \
            > "backups/dev-${TIMESTAMP}.db"

          echo "Backup criado: dev-${TIMESTAMP}.db ($(du -sh backups/dev-${TIMESTAMP}.db | cut -f1))"

      - name: Rotacionar backups (manter últimos 30)
        run: |
          cd backups
          ls -1t dev-*.db 2>/dev/null | tail -n +31 | xargs -r rm -f
          echo "Backups mantidos: $(ls -1 dev-*.db 2>/dev/null | wc -l)"

      - name: Commit e push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add backups/
          TIMESTAMP=$(date -u +%Y-%m-%d)
          git diff --staged --quiet || git commit -m "backup: ${TIMESTAMP}"
          git push
