name: Backup Diário do Banco

on:
  schedule:
    - cron: "0 3 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: backups

      - name: Instalar PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Executar backup
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          mkdir -p backups
          TIMESTAMP=$(date -u +%Y-%m-%d-%H%M%S)
          pg_dump "$DATABASE_URL" -F p -f "backups/prod-${TIMESTAMP}.sql" --no-owner --no-acl
          echo "Backup criado: prod-${TIMESTAMP}.sql"

      - name: Rotacionar backups (manter últimos 30)
        run: |
          cd backups
          ls -1t prod-*.sql 2>/dev/null | tail -n +31 | xargs -r rm -f
          echo "Backups restantes: $(ls -1 prod-*.sql 2>/dev/null | wc -l)"

      - name: Commit e push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add backups/
          TIMESTAMP=$(date -u +%Y-%m-%d)
          git diff --staged --quiet || git commit -m "backup: ${TIMESTAMP}"
          git push
