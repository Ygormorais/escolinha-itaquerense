name: Deploy de Produção

on:
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_USER: ${{ secrets.SSH_USER }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
      SSH_APP_DIR: ${{ secrets.SSH_APP_DIR }}
      APP_URL: ${{ vars.APP_URL }}

    steps:
      - name: Validar configuração
        shell: bash
        run: |
          set -euo pipefail
          for name in SSH_HOST SSH_USER SSH_PRIVATE_KEY SSH_KNOWN_HOSTS SSH_APP_DIR APP_URL; do
            [[ -n "${!name:-}" ]] || { echo "::error::${name} ausente no environment production"; exit 1; }
          done
          [[ "$APP_URL" =~ ^https://[A-Za-z0-9.-]+(:[0-9]+)?/?$ ]] \
            || { echo "::error::APP_URL deve ser uma origem HTTPS sem path"; exit 1; }

      - name: Preparar acesso SSH
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          install -m 600 /dev/null "$HOME/.ssh/deploy_key"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/deploy_key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"

      - name: Criar snapshot e publicar master
        shell: bash
        run: |
          set -euo pipefail
          printf -v quoted_app '%q' "$SSH_APP_DIR"
          ssh \
            -i "$HOME/.ssh/deploy_key" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "$SSH_USER@$SSH_HOST" \
            "cd $quoted_app && bash deploy/deploy.sh"

      - name: Verificar aplicação publicada
        shell: bash
        run: |
          set -euo pipefail
          curl \
            --fail \
            --silent \
            --show-error \
            --retry 6 \
            --retry-all-errors \
            --retry-delay 5 \
            "${APP_URL%/}/api/health"

      - name: Remover chave temporária
        if: always()
        shell: bash
        run: rm -f "$HOME/.ssh/deploy_key"
