name: Cron - Lembretes Diários

on:
  schedule:
    - cron: "0 12 * * *" # 12h UTC = 09h Brasília
  workflow_dispatch:

permissions: {}

concurrency:
  group: production-lembretes
  cancel-in-progress: false

jobs:
  lembretes:
    if: github.event_name == 'workflow_dispatch' || vars.LEMBRETES_CRON_ENABLED == 'true'
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      APP_URL: ${{ vars.APP_URL }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}

    steps:
      - name: Enviar lembretes e validar resultado
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ -n "$APP_URL" ]] || { echo "::error::APP_URL ausente"; exit 1; }
          [[ -n "$CRON_SECRET" ]] || { echo "::error::CRON_SECRET ausente"; exit 1; }
          [[ "$APP_URL" =~ ^https://[A-Za-z0-9.-]+(:[0-9]+)?/?$ ]] \
            || { echo "::error::APP_URL deve ser uma origem HTTPS sem path"; exit 1; }

          response="$(mktemp)"
          trap 'rm -f "$response"' EXIT

          if ! status="$(curl \
            --silent \
            --show-error \
            --output "$response" \
            --write-out '%{http_code}' \
            --proto '=https' \
            --proto-redir '=https' \
            --connect-timeout 10 \
            --max-time 300 \
            --header "Authorization: Bearer $CRON_SECRET" \
            --header "Accept: application/json" \
            "${APP_URL%/}/api/cron/lembretes")"; then
            echo "::error::Falha de rede ou timeout ao executar lembretes"
            exit 1
          fi

          [[ "$status" =~ ^2[0-9]{2}$ ]] || { echo "::error::Endpoint retornou HTTP $status"; exit 1; }
          jq empty "$response" >/dev/null || { echo "::error::Resposta não é JSON válido"; exit 1; }
          jq -e '
            type == "object"
            and (.executadoEm | type == "string" and length > 0)
            and (.durMs | type == "number" and . >= 0)
            and ([.. | objects | select((.error? // "") != "")] | length) == 0
            and ([.. | objects | (.erros? // empty)] | all(. == 0))
          ' "$response" >/dev/null \
            || { echo "::error::Execução reportou falhas parciais"; exit 1; }

          {
            echo "### Lembretes executados com sucesso"
            echo
            jq -r '"- Executado em: `\(.executadoEm)`\n- Duração: `\(.durMs) ms`"' "$response"
          } >> "$GITHUB_STEP_SUMMARY"
